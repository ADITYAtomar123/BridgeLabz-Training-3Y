<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Background Webpage</title>
    <link rel="stylesheet" href="Ques3.css">
</head>
<body>
    <header>
        <h1>Gradient Background Webpage</h1>
    </header>
    <main>
        <section class="linear">
            <h2>Linear Gradient</h2>
            <p>
                This section uses a linear gradient background.
                The colors smoothly change from one side to another.
            </p>
        </section>
        <section class="radial">
            <h2>Radial Gradient</h2>
            <p>
                This section uses a radial gradient background.
                The colors spread outward from the center.
            </p>
        </section>
    </main>
    <footer>
        <p>© 2026 Gradient Webpage</p>
    </footer>

</body>
</html>
