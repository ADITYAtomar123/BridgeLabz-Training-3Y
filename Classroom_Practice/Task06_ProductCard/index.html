<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div class="box">

        <div class="image-section">
            <img src="photo.jpeg">

            <span class="discount">20% OFF</span>

            <span class="heart">♡</span>
        </div>

        <div class="content">

            <p class="category">SPORTS SHOES</p>

            <h2>Premium Running Shoes</h2>

            <p class="rating">⭐⭐⭐⭐⭐ <span>(120)</span></p>

            <div class="price">
                ₹1,999
                <del>₹2,499</del>
            </div>

            <button>Add to Cart</button>

        </div>

    </div>

</body>
</html>
