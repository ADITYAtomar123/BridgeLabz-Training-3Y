<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dropdown-based Selection Page</title>
</head>
<body>
    <h1 align="center">Dropdown-based Selection Page</h1>
    <label for="country">Country : </label>
    <select id="country">
        <option selected>India</option>
        <option>USA</option>
        <option>Australia</option>
        <option>England</option>
        <option>China</option>
        <option>New Zealand</option>
        <option>West Indies</option>
    </select>
    <br><br>

    <label for="state">States : </label>
    <select id="state">
        <option selected>Uttar Pradesh</option>
        <option>Uttarakhand</option>
        <option>Rajasthan</option>
        <option>Delhi</option>
        <option>Bihar</option>
        <option>Goa</option>
    </select>
    <br><br>

    <label for="city">City : </label>
    <select id="city">
        <option selected>Mathura</option>
        <option>Budaun</option>
        <option>Agra</option>
        <option>Lucknow</option>
        <option>Varanasi</option>
    </select>
    <br><br>
    
    <label for="place">Favorite Tourist Place : </label>
    <select id="place">
        <option selected>Banke Bihari Temple</option>
        <option>Taj Mahal</option>
        <option>Goa Beach</option>
        <option>India Gate</option>
        <option>Jaipur</option>
    </select>

    <br><br>

    <p>
        My selected choices are:
        Country - India,
        State - Uttar Pradesh,
        City - Mathura,
        Favorite Tourist Place - Banke Bihari Temple.
        </p>
    </body>
</html>
