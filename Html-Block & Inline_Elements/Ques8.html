<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Report Card</title>
</head>
<body>
   <header>
    <h1 align="center">ABC Public School</h1>
    <h3 align="center">Student Report Card</h3>
   </header> 
   <hr>
   <table border="1" cellspacing="0" cellpadding="8" width="80%" align="center">
    <tr>
        <th>Student Name</th>
        <td>Aditya</td>
        <th>Class</th>
        <td>B.Tech</td>
    </tr>
    <tr>
        <th>Roll no.</th>
        <td>101</td>
        <th>Year</th>
        <td>2026</td>
    </tr>
   </table>
   <hr>
   <table align="center" border="1" cellspacing="0" cellpadding="8" width="80%">
        <tr>
            <th title="Name of the Subject">Subject</th>
            <th title="Maximum Marks">Max Marks</th>
            <th title="Marks obtained by student">Marks Obtained</th>
        </tr>
        <tr>
            <td>Mathematics</td>
            <td>100</td>
            <td>85</td>
        </tr>
        <tr>
            <td>Computer Science</td>
            <td>100</td>

            <td>92</td>
        </tr>
        <tr>
            <td>English</td>
            <td>100</td>
            <td>78</td>
        </tr>
        <tr>
            <td>Physics</td>
            <td>100</td>
            <td>88</td>
        </tr>
        <tr>
            <td>Electronics</td>
            <td>100</td>
            <td>81</td>
        </tr>
        <tr>
            <th rowspan="2">Result</th>
            <th>Total</th>
            <td>424 / 500</td>
        </tr>
        <tr>
            <th>Percentage</th>
            <td>84.8%</td>
        </tr>
   </table>
</body>
</html>
