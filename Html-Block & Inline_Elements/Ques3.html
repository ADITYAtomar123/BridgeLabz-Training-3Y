<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <h1 align="center">Course Registration Form</h1>
    <form>
        <fieldset>
            <legend>Student Information</legend>
        <label for="name">Student Name : </label>
        <input type="text" placeholder="Enter Your Name" id="name">
        <br><br>
        <label for="mail">Email : </label>
        <input type="email" placeholder="abc@gmail.com" id="mail">
        <br><br>
        <label for="course">Course : </label>
        <select id="course">
            <option>Select Course</option>
            <option>BTECH</option>
            <option>BCA</option>
            <option>MBA</option>
            <option>MTECH</option>
            <option>MCA</option>
        </select>
        <br><br>
    
            <input type="submit" value="Register">
    
        </fieldset>

    </form>

    <br>
    <h2>Available Course Schedules</h2>
    <table border="1" cellspacing="0" cellpadding="8" width="70%">
        <tr>
            <th>Day</th>
            <th>Time</th>
            <th>Instructor</th>
        </tr>
        <tr>
            <td>Monday</td>
            <td>10:00 AM - 12:00 PM</td>
            <td>Dr. Sharma</td>
        </tr>

        <tr>
            <td>Wednesday</td>
            <td>11:00 AM - 1:00 PM</td>
            <td>Prof. Verma</td>
        </tr>

        <tr>
            <td>Friday</td>
            <td>2:00 PM - 4:00 PM</td>
            <td>Dr. Singh</td>
        </tr>

    </table>
</body>
</html>
