<!DOCTYPE html>
<html>
<head>
    <title>Product Catalog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .product-card { transition: 0.3s; }
        .product-card:hover { transform: translateY(-5px); }
    </style>
</head>
<body>
<div class="container py-5">
    <h1 class="text-center mb-4">Product Catalog</h1>
    <div class="row g-4">
        <div class="col-12 col-sm-6 col-md-3"><div class="card shadow-sm product-card">
            <img src="https://via.placeholder.com/300" class="card-img-top">
            <div class="card-body"><h5>Sports Shoes</h5><p>₹1,999</p><button class="btn btn-primary">Add to Cart</button></div>
        </div></div>
        <div class="col-12 col-sm-6 col-md-3"><div class="card shadow-sm product-card">
            <img src="https://via.placeholder.com/300" class="card-img-top">
            <div class="card-body"><h5>Smart Watch</h5><p>₹2,999</p><button class="btn btn-primary">Add to Cart</button></div>
        </div></div>
        <div class="col-12 col-sm-6 col-md-3"><div class="card shadow-sm product-card">
            <img src="https://via.placeholder.com/300" class="card-img-top">
            <div class="card-body"><h5>Headphones</h5><p>₹1,499</p><button class="btn btn-primary">Add to Cart</button></div>
        </div></div>
        <div class="col-12 col-sm-6 col-md-3"><div class="card shadow-sm product-card">
            <img src="https://via.placeholder.com/300" class="card-img-top">
            <div class="card-body"><h5>Backpack</h5><p>₹999</p><button class="btn btn-primary">Add to Cart</button></div>
        </div></div>
    </div>
</div>
</body>
</html>
