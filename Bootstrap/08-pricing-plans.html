<!DOCTYPE html>
<html>
<head>
    <title>Pricing Plans</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .price-card { transition:0.3s; }
        .price-card:hover { transform:translateY(-8px); }
    </style>
</head>
<body>
<div class="container py-5">
    <h1 class="text-center mb-5">Choose Your Plan</h1>
    <div class="row g-4">
        <div class="col-md-4"><div class="card shadow-lg price-card"><div class="card-body text-center">
            <h3>Basic</h3><h2>₹499</h2>
            <ul class="list-group mb-3"><li class="list-group-item">5 Projects</li><li class="list-group-item">Basic Support</li><li class="list-group-item">10 GB Storage</li></ul>
            <button class="btn btn-outline-primary">Choose</button>
        </div></div></div>
        <div class="col-md-4"><div class="card bg-primary text-white shadow-lg price-card"><div class="card-body text-center">
            <h3>Pro</h3><h2>₹999</h2>
            <ul class="list-group text-dark mb-3"><li class="list-group-item">20 Projects</li><li class="list-group-item">Priority Support</li><li class="list-group-item">50 GB Storage</li></ul>
            <button class="btn btn-light">Choose</button>
        </div></div></div>
        <div class="col-md-4"><div class="card shadow-lg price-card"><div class="card-body text-center">
            <h3>Premium</h3><h2>₹1499</h2>
            <ul class="list-group mb-3"><li class="list-group-item">Unlimited Projects</li><li class="list-group-item">24/7 Support</li><li class="list-group-item">100 GB Storage</li></ul>
            <button class="btn btn-outline-primary">Choose</button>
        </div></div></div>
    </div>
</div>
</body>
</html>
