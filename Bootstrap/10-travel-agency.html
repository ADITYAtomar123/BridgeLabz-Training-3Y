<!DOCTYPE html>
<html>
<head>
    <title>Travel Agency</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-4">
    <h1 class="text-center mb-4">Explore The World</h1>
    <div id="travelCarousel" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active" data-bs-interval="2000">
                <img src="https://via.placeholder.com/1200x500?text=Paris" class="d-block w-100" alt="Paris">
                <div class="carousel-caption"><h3>Paris</h3><p>Experience the beauty of Paris.</p></div>
            </div>
            <div class="carousel-item" data-bs-interval="3000">
                <img src="https://via.placeholder.com/1200x500?text=Dubai" class="d-block w-100" alt="Dubai">
                <div class="carousel-caption"><h3>Dubai</h3><p>Explore the city of dreams.</p></div>
            </div>
            <div class="carousel-item" data-bs-interval="4000">
                <img src="https://via.placeholder.com/1200x500?text=Maldives" class="d-block w-100" alt="Maldives">
                <div class="carousel-caption"><h3>Maldives</h3><p>Relax on beautiful beaches.</p></div>
            </div>
        </div>
        <button class="carousel-control-prev" data-bs-target="#travelCarousel" data-bs-slide="prev"><span class="carousel-control-prev-icon"></span></button>
        <button class="carousel-control-next" data-bs-target="#travelCarousel" data-bs-slide="next"><span class="carousel-control-next-icon"></span></button>
    </div>
    <h4 class="mt-4">Booking Completion</h4>
    <div class="progress">
        <div class="progress-bar progress-bar-striped progress-bar-animated" style="width:70%">70%</div>
    </div>
</div>
<footer class="bg-dark text-white text-center p-3 mt-4">Contact: travel@example.com | +91 9876543210</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
