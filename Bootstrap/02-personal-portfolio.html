<!DOCTYPE html>
<html>
<head>
    <title>My Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light text-dark">
<div class="container text-center p-5">
    <header class="mb-3">
        <h1 class="fw-bold">Aditya Tomar</h1>
        <p>Computer Science Student & Web Developer</p>
    </header>
    <img src="https://via.placeholder.com/180" class="img-fluid rounded-circle mb-3" alt="Profile">
    <div class="mb-3">
        <button class="btn btn-primary me-2">Hire Me</button>
        <button class="btn btn-outline-dark">Download CV</button>
    </div>
    <form class="mx-auto" style="max-width:500px;">
        <input type="text" class="form-control mb-3" placeholder="Your Name">
        <input type="email" class="form-control mb-3" placeholder="Your Email">
        <textarea class="form-control mb-3" placeholder="Your Message"></textarea>
        <button class="btn btn-success">Send Message</button>
    </form>
</div>
</body>
</html>
