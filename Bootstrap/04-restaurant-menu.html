<!DOCTYPE html>
<html>
<head>
    <title>Restaurant Menu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
    <h1 class="text-center">Today's Menu</h1>
    <p class="lead text-center">Fresh and delicious food</p>
    <table class="table table-striped table-bordered mt-4">
        <thead class="table-dark"><tr><th>Item</th><th>Category</th><th>Price</th></tr></thead>
        <tbody>
            <tr><td>Pizza</td><td>Main Course</td><td>₹250</td></tr>
            <tr><td>Pasta</td><td>Main Course</td><td>₹200</td></tr>
            <tr><td>Ice Cream</td><td>Dessert</td><td>₹100</td></tr>
        </tbody>
    </table>
    <h3>Chef's Specials</h3>
    <ul class="list-group mb-4">
        <li class="list-group-item">Special Biryani</li>
        <li class="list-group-item">Cheese Pizza</li>
        <li class="list-group-item">Chocolate Cake</li>
    </ul>
    <div class="text-center">
        <img src="https://via.placeholder.com/500x300?text=Food" class="img-fluid rounded" alt="Food">
        <p>Our delicious special dish</p>
    </div>
</div>
</body>
</html>
