<!DOCTYPE html>
<html>
<head>
    <title>Task Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
    <div class="d-flex justify-content-between mb-4">
        <h2>Task Tracker</h2><span class="badge bg-danger fs-6">3 Pending</span>
    </div>
    <div class="list-group">
        <div class="list-group-item d-flex justify-content-between">Complete assignment <span class="badge bg-danger">High</span></div>
        <div class="list-group-item d-flex justify-content-between">Study Bootstrap <span class="badge bg-warning text-dark">Medium</span></div>
        <div class="list-group-item d-flex justify-content-between">Read notes <span class="badge bg-success">Low</span></div>
    </div>
    <button class="btn btn-success mt-4">Completed <span class="badge bg-light text-dark">2</span></button>
</div>
</body>
</html>
