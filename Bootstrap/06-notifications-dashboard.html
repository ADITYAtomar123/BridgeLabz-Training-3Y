<!DOCTYPE html>
<html>
<head>
    <title>Notifications Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
    <div class="card">
        <div class="card-header"><h3>Notifications</h3></div>
        <div class="card-body">
            <div class="alert alert-success">New message received!</div>
            <div class="alert alert-info">Tip: Complete your profile.</div>
            <div class="alert alert-danger">Warning: Your password will expire soon.</div>
            <div class="alert alert-warning alert-dismissible fade show">
                This is a dismissible notification.
                <button class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div class="bg-light border p-4">
                <h5>Summary</h5><p>You have 3 new notifications.</p>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
