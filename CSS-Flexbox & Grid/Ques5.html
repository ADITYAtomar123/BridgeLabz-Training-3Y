<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Section</title>
    <link rel="stylesheet" href="./Ques5.css">
</head>
<body>
    <div class="container">
        <div class="box">
            <h2>Basic</h2>
            <p class="price">$40</p>
            <p>1 User</p>
            <p>5 GB Storage</p>
            <p>Email Support</p>
            <button>Choose Plan</button>
        </div> 
        <div class="box2">
            <h2>Standard</h2>
            <p class="price">$200</p>
            <p>5 Users</p>
            <p>50 GB Storage</p>
            <p>Priority Support</p>
            <button>Choose Plan</button>
         </div>
        <div class="box">
            <h2>Premium</h2>
            <p class="price">$100</p>
            <p>10 Users</p>
            <p>100 GB Storage</p> 
            <p>24/7 Support</p>
            <button>Choose Plan</button>
         </div>
    </div>
</body>
</html>
