<!DOCTYPE html>
<html lang="en">
<head>

    <!-- The title tag defines the title shown in the browser tab. -->
    <title>Important Head Elements</title>

    <!-- The meta charset tag defines the character encoding. -->
    <meta charset="UTF-8">

    <!-- The meta description tag provides a description of the webpage. -->
    <meta
        name="description"
        content="A webpage demonstrating important HTML head elements.">

    <!-- The meta author tag specifies the author. -->
    <meta
        name="author"
        content="Aditya Tomar">

    <!-- The viewport meta tag helps the page display properly on different screen sizes. -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <!-- The base tag sets the base URL for relative URLs. -->
    <base href="https://example.com/">

    <!-- The link tag connects an external resource such as a favicon. -->
    <link rel="icon" href="favicon.ico">

    <!-- The style tag is used for internal CSS. It is empty here as required. -->
    <style>
    </style>

    <!-- The script tag is used for JavaScript. It is empty here as required. -->
    <script>
    </script>

</head>
<body>
    <h2>Important Head Elements</h2>

    <p>
        This webpage demonstrates important elements used inside
        the HTML head section.
    </p>
</body>
</html>
