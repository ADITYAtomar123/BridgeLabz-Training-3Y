<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form Security</title>
</head>
<body>
    <h2>Secure Form</h2>

    <!-- autocomplete="off" prevents automatic form suggestions -->
    <form action="#" method="post" autocomplete="off">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <br><br>

        <button type="submit">Submit</button>
    </form>

    <p>
        Turning off autocomplete can improve security by preventing
        the browser from automatically storing and filling sensitive
        information, especially when using shared or public computers.
    </p>
</body>
</html>
