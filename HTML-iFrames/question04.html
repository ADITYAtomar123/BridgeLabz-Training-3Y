<!DOCTYPE html>
<html lang="en">
<head>
    <title>Frameset Layout</title>
</head>

<!-- Divide the page into top and bottom frames -->
<frameset rows="20%,80%">
    <!-- Top frame contains navigation links -->
    <frame src="navigation.html" name="topFrame">

    <!-- Bottom frame displays website content -->
    <frame src="welcome.html" name="bottomFrame">
</frameset>

</html>
