<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google Map</title>
</head>
<body>
    <h2>My City - Mathura</h2>

    <!-- loading="lazy" loads the map only when it is near the visible area -->
    <iframe
        src="https://www.google.com/maps?q=Mathura,Uttar+Pradesh&output=embed"
        title="Google Map of Mathura"
        width="600"
        height="450"
        loading="lazy">
    </iframe>
</body>
</html>
