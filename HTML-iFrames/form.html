<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form</title>
</head>
<body>
    <h2>Simple Form</h2>

    <!-- The target sends the submitted result to the iframe named resultFrame. -->
    <form action="result.html" method="get" target="resultFrame">
        <label for="name">Enter Name:</label>
        <input type="text" id="name" name="name" required>

        <button type="submit">Submit</button>
    </form>

    <br>

    <!-- Result page will be loaded inside this iframe -->
    <iframe
        name="resultFrame"
        title="Form Result"
        width="100%"
        height="150">
    </iframe>
</body>
</html>
