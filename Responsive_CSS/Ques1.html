<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Gallery</title>
    <link rel="stylesheet" href="Ques1.css">
</head>

<body>

    <div class="container">

        <div class="box">
            <img class="blur" src="./photo.jpeg">
            <h2>Blur</h2>
        </div>

        <div class="box">
            <img class="grayscale" src="./photo.jpeg">
            <h2>Grayscale</h2>
        </div>

        <div class="box">
            <img class="sepia" src="./photo.jpeg">
            <h2>Sepia</h2>
        </div>

        <div class="box">
            <img class="brightness" src="./photo.jpeg">
            <h2>Brightness</h2>
        </div>

        <div class="box">
            <img class="contrast" src="./photo.jpeg">
            <h2>Contrast</h2>
        </div>

        <div class="box">
            <img class="hue" src="./photo.jpeg">
            <h2>Hue Rotate</h2>
        </div>

    </div>

</body>
</html>
