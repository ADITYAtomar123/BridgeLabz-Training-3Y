<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison</title>
    <link rel="stylesheet" href="Ques8.css">
</head>
<body>

    <h1>Filter Comparison</h1>

    <div class="comparison">

        <div class="image-box">
            <img src="photo.jpeg" alt="Original Image">
            <h2>Before</h2>
            <p>Original image without filter</p>
        </div>

        <div class="image-box">
            <img class="filtered" src="photo.jpeg" alt="Filtered Image">
            <h2>After</h2>
            <p>Image with brightness filter</p>
        </div>

    </div>

</body>
</html>
