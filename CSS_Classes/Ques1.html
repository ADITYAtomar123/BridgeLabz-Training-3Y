
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo Classes</title>
    <link rel="stylesheet" href="Ques1.css">
</head>
<body>

    <div class="container">

        <div class="box">
            <h2>:hover</h2>
            <a href="#">Hover Me</a>
            <p>Changes when the mouse is placed over the link.</p>
        </div>

        <div class="box">
            <h2>:focus</h2>
            <button>Click / Focus Me</button>
            <p>Changes when the button gets focus.</p>
        </div>

        <div class="box">
            <h2>:active</h2>
            <button>Press Me</button>
            <p>Changes while the button is being pressed.</p>
        </div>

        <div class="box">
            <h2>:nth-child()</h2>
            <ul>
                <li>First Item</li>
                <li>Second Item</li>
                <li>Third Item</li>
            </ul>
            <p>Changes the style of a specific list item.</p>
        </div>

    </div>

</body>
</html>
