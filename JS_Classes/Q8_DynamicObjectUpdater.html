<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dynamic Object Updater</title>
</head>
<body>
    <h2>Edit User Details</h2>
    <form id="userForm">
        <input id="name" placeholder="Name" required><br><br>
        <input id="email" type="email" placeholder="Email" required><br><br>
        <input id="age" type="number" min="0" placeholder="Age" required><br><br>
        <button type="submit">Update</button>
    </form>
    <h3>Updated User Details</h3>
    <pre id="output"></pre>
    <script src="Q8_DynamicObjectUpdater.js"></script>
</body>
</html>
