<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Movie Ticket Booking</title>
</head>
<body>
    <h2>Book Movie Tickets</h2>
    <form id="bookingForm">
        <input id="name" placeholder="Name" required><br><br>
        <input id="email" type="email" placeholder="Email" required><br><br>
        <input id="seats" type="number" min="1" max="10" placeholder="Seats (1-10)" required><br><br>
        <button type="submit">Book Ticket</button>
    </form>
    <p id="result"></p>
    <script src="Q5_MovieTicketBooking.js"></script>
</body>
</html>
